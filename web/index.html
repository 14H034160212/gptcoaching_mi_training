<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GPTCoach MI Demo + Cognitive Map</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #left, #right {
      padding: 12px;
      box-sizing: border-box;
    }
    #left {
      width: 50%;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
    }
    #right {
      width: 50%;
      display: flex;
      flex-direction: column;
    }
    #chat-log {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 8px;
      overflow-y: auto;
      background: #fafafa;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .msg-user {
      color: #1a73e8;
      margin-bottom: 4px;
    }
    .msg-coach {
      color: #0b8043;
      margin-bottom: 8px;
    }
    #controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    #input-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    #user-input {
      flex: 1;
      padding: 6px 8px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #999;
      background: #f5f5f5;
      cursor: pointer;
    }
    button:hover {
      background: #e8e8e8;
    }

    /* -------------------- Cognitive Map 区域 -------------------- */
    #map-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    /* Summary Box */
    #summary-box {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      background: #fafafa;
      min-height: 80px;
      max-height: 40vh;
      overflow-y: auto;
      margin-bottom: 8px;
      font-size: 13px;
      line-height: 1.4;
    }

    #cy {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #status, #mapStatus {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <!-- ---------------- Left: Chat Panel ---------------- -->
  <div id="left">
    <div id="controls">
      <label for="user-id">User ID:</label>
      <input id="user-id" type="text" value="demo_user" />
      <button id="reset-btn">Reset Session</button>
    </div>

    <div id="chat-log"></div>

    <div id="input-row">
      <input id="user-input" type="text" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
    </div>

    <div id="status"></div>
  </div>

  <!-- ---------------- Right: Cognitive Map Panel ---------------- -->
  <div id="right">
    <div id="map-controls">
      <strong>Cognitive Map</strong>
      <button id="refresh-map-btn">Refresh Map</button>
      <button id="download-png-btn">Download PNG</button>
      <button id="download-svg-btn">Download SVG</button>
    </div>

    <div id="summary-box">
      <strong>Map Summary:</strong>
      <div id="mapSummary"></div>
    </div>

    <div id="cy"></div>

    <div id="mapStatus"></div>
  </div>

  <!-- Cytoscape + SVG -->
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <script src="https://unpkg.com/cytoscape-svg@2.1.2/cytoscape-svg.min.js"></script>

  <script>
    if (typeof cytoscapeSvg !== "undefined") {
      cytoscape.use(cytoscapeSvg);
    }

    const apiBase = "/api";

    const userInput = document.getElementById("user-input");
    const userIdInput = document.getElementById("user-id");
    const chatLog = document.getElementById("chat-log");
    const statusEl = document.getElementById("status");
    const mapStatusEl = document.getElementById("mapStatus");
    const mapSummaryEl = document.getElementById("mapSummary");

    const sendBtn = document.getElementById("send-btn");
    const resetBtn = document.getElementById("reset-btn");
    const refreshMapBtn = document.getElementById("refresh-map-btn");
    const downloadPngBtn = document.getElementById("download-png-btn");
    const downloadSvgBtn = document.getElementById("download-svg-btn");

    let cy = null;

    // ---------------- Chat logic ----------------
    function appendMsg(role, text) {
      const div = document.createElement("div");
      div.className = role === "user" ? "msg-user" : "msg-coach";
      div.textContent = (role === "user" ? "User: " : "Coach: ") + text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    async function sendMessage() {
      const msg = userInput.value.trim();
      if (!msg) return;

      const userId = userIdInput.value.trim() || "anon";
      appendMsg("user", msg);
      userInput.value = "";
      statusEl.textContent = "Sending...";

      try {
        const res = await fetch(`${apiBase}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId, history: [], user_msg: msg }),
        });

        const data = await res.json();
        appendMsg("coach", data.reply || "");
        statusEl.textContent = "Ready.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Error sending message.";
      }
    }

    async function resetSession() {
      const userId = userIdInput.value.trim() || "anon";
      chatLog.innerHTML = "";
      statusEl.textContent = "Resetting...";
      await fetch(`${apiBase}/reset`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId }),
      });
      statusEl.textContent = "Session reset.";
    }

    // ---------------- Map logic ----------------
    async function refreshCogMap() {
      const userId = userIdInput.value.trim() || "anon";
      mapStatusEl.innerText = "Loading cognitive map...";

      try {
        const resp = await fetch(`${apiBase}/cogmap`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userId }),
        });

        const data = await resp.json();

        if (data.error) {
          mapStatusEl.innerText = "No map: " + data.error;
          mapSummaryEl.innerText = "";
          return;
        }

        renderMap(data);
        mapSummaryEl.innerText = data.summary || "";
        mapStatusEl.innerText = "Map updated.";
      } catch (err) {
        console.error(err);
        mapStatusEl.innerText = "Error loading map.";
      }
    }

    function renderMap(data) {
      const elements = [];

      const typeColor = {
        goal: "#1e88e5",
        value: "#6a1b9a",
        strength: "#43a047",
        barrier: "#e53935",
        belief: "#fb8c00",
        action: "#00897b",
        outcome: "#5e35b1",
      };

      (data.nodes || []).forEach(n => {
        elements.push({
          data: {
            id: n.id,
            label: n.label,
            type: (n.type || "").toLowerCase(),
          }
        });
      });

      (data.edges || []).forEach(e => {
        elements.push({
          data: {
            id: `${e.source}-${e.target}-${e.type}`,
            source: e.source,
            target: e.target,
            type: e.type,
          }
        });
      });

      if (cy) cy.destroy();

      cy = cytoscape({
        container: document.getElementById("cy"),
        elements,
        style: [
          {
            selector: "node",
            style: {
              label: "data(label)",
              "text-wrap": "wrap",
              "text-max-width": "120px",
              "font-size": 10,
              "text-valign": "center",
              "text-halign": "center",
              "border-width": 1,
              "border-color": "#555",
              padding: "8px",
              "background-color": ele =>
                typeColor[ele.data("type")] || "#90a4ae",
            },
          },
          {
            selector: "edge",
            style: {
              width: 1.5,
              "line-color": "#999",
              "target-arrow-color": "#999",
              "target-arrow-shape": "triangle",
              "curve-style": "bezier",
              label: "data(type)",
              "font-size": 8,
              "text-rotation": "autorotate",
            },
          }
        ],
        layout: { name: "cose", animate: false, fit: true }
      });
    }

    // ---------------- Downloads ----------------
    function downloadPng() {
      if (!cy) return;
      const png = cy.png({ full: true, scale: 2 });
      const a = document.createElement("a");
      a.href = png;
      a.download = "cognitive_map.png";
      a.click();
    }

    function downloadSvg() {
      if (!cy || typeof cy.svg !== "function") {
        alert("SVG export not available.");
        return;
      }
      const svgContent = cy.svg({ full: true });
      const blob = new Blob([svgContent], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cognitive_map.svg";
      a.click();
      URL.revokeObjectURL(url);
    }

    sendBtn.onclick = sendMessage;
    resetBtn.onclick = resetSession;
    refreshMapBtn.onclick = refreshCogMap;
    downloadPngBtn.onclick = downloadPng;
    downloadSvgBtn.onclick = downloadSvg;

    userInput.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    statusEl.textContent = "Ready.";
  </script>
</body>
</html>
